version: "3.8"

# ============================================================
#  FL Centralizado – 7 Silos
#  Ejecutar ANTES: python prepare_environment.py
#  Luego: docker-compose up --build
# ============================================================

x-worker-base: &worker-base
  build: .
  depends_on:
    server:
      condition: service_healthy
  volumes:
    - ./data/silos:/app/data/silos:ro
    - ./artifacts:/app/artifacts:ro
    - ./logs:/app/logs
  environment:
    - SERVER_URI=ws://server:8765
  restart: on-failure:3

services:

  # ──────────────────────────────────────────────────────────
  # Servidor central (agregador)
  # ──────────────────────────────────────────────────────────
  server:
    build: .
    command: python server_centralized.py
    ports:
      - "8765:8765"
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',8765)); s.close()\" 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ──────────────────────────────────────────────────────────
  # Workers (silos)
  # ──────────────────────────────────────────────────────────
  worker_1:
    <<: *worker-base
    command: python worker_centralized.py silo_1 data/silos/silo_1.csv ws://server:8765

  worker_2:
    <<: *worker-base
    command: python worker_centralized.py silo_2 data/silos/silo_2.csv ws://server:8765

  worker_3:
    <<: *worker-base
    command: python worker_centralized.py silo_3 data/silos/silo_3.csv ws://server:8765

  worker_4:
    <<: *worker-base
    command: python worker_centralized.py silo_4 data/silos/silo_4.csv ws://server:8765

  worker_5:
    <<: *worker-base
    command: python worker_centralized.py silo_5 data/silos/silo_5.csv ws://server:8765

  worker_6:
    <<: *worker-base
    command: python worker_centralized.py silo_6 data/silos/silo_6.csv ws://server:8765

  worker_7:
    <<: *worker-base
    command: python worker_centralized.py silo_7 data/silos/silo_7.csv ws://server:8765
